services:
  db:
    image: postgres:16-alpine
    container_name: hostayo-db
    environment:
      POSTGRES_USER: hostayo
      POSTGRES_PASSWORD: hostayo
      POSTGRES_DB: hostayo
    ports:
      - "5432:5432"
    volumes:
      - hostayo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostayo -d hostayo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hostayo-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - hostayo-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hostayo-pgdata:
  hostayo-redisdata:
